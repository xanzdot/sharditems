name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.1" }
      - name: Build
        run: |
          set +e
          gradle build --console=plain > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|warning: \[|What went wrong|Could not|FAILED|symbol:|location:" -A2 /tmp/build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code
      - run: cd resourcepack && zip -qr /tmp/emerald-tools-resourcepack.zip .
      - uses: actions/upload-artifact@v4
        with: { name: emerald-tools, path: build/libs/*.jar }
      - name: Publish to dist branch and release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls build/libs/*.jar | head -1)" /tmp/emerald-tools.jar
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 /tmp/emerald-tools.jar /tmp/emerald-tools-resourcepack.zip --title "Emerald Tools (Paper)" --notes "Paper plugin for 1.21.11 plus resource pack"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan dist
          git rm -rf . -q
          cp /tmp/emerald-tools.jar /tmp/emerald-tools-resourcepack.zip .
          git add emerald-tools.jar emerald-tools-resourcepack.zip
          git commit -qm "Built jar"
          git push -f origin dist
