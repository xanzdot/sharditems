name: build
on:
  push:
    branches: [trippy-rainbow]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.8.2" }
      - name: Build
        id: build
        run: |
          set +e
          gradle build --console=plain > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|What went wrong|Could not|FAILED|symbol:|location:|Unable|not found" -A2 /tmp/build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cp /tmp/build.log ./build-log.txt
          exit 0
      - name: Validate shader
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools > /dev/null
          cat > /tmp/globals.glsl <<'GLSL'
          layout(std140) uniform Globals {
              ivec3 CameraBlockPos;
              float GlintAlpha;
              vec3 CameraOffset;
              float GameTime;
              vec2 ScreenSize;
              int MenuBlurRadius;
              int UseRgss;
          };
          GLSL
          sed -e '/#include <minecraft:globals.glsl>/{r /tmp/globals.glsl' -e 'd}' src/main/resources/assets/trippy_rainbow/shaders/post/trippy.fsh > /tmp/trippy_stub.frag
          glslangValidator -S frag /tmp/trippy_stub.frag > /tmp/glsl.log 2>&1 && echo "shader OK" > /tmp/glsl.status || { echo "shader FAILED" > /tmp/glsl.status; }
          cat /tmp/glsl.status /tmp/glsl.log
          cp /tmp/glsl.status /tmp/glsl.log . 
          grep -E "ERROR|WARNING" /tmp/glsl.log | head -20 | while IFS= read -r line; do echo "::warning::${line}"; done
          echo "::notice::$(cat /tmp/glsl.status)"
      - name: Publish outputs to branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/pub
          cp build-log.txt glsl.status glsl.log /tmp/pub/ 2>/dev/null || true
          ls build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 | xargs -I{} cp {} /tmp/pub/trippy-rainbow.jar || true
          if [ -f /tmp/pub/trippy-rainbow.jar ]; then
            gh release delete trippy-rainbow-1.0.0 --yes --cleanup-tag || true
            gh release create trippy-rainbow-1.0.0 /tmp/pub/trippy-rainbow.jar --target trippy-rainbow --title "Trippy Rainbow (Fabric 26.3)" --notes "Client-side Fabric mod for Minecraft 26.3. Press K to cycle Off / Mild / Full / Insane."
          fi
          git checkout --orphan trippy-dist
          git rm -rf . -q
          cp -r /tmp/pub/. .
          git add -A
          git commit -qm "Build outputs" || true
          git push -f origin trippy-dist
      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
